name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: v2/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: v2

      - name: Run pipeline
        run: python pipeline/pipeline.py --sources github,rss --limit 20 --verbose
        working-directory: v2
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate articles
        run: |
          count=$(find knowledge/articles -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            python hooks/validate_json.py knowledge/articles/*.json
            python hooks/check_quality.py knowledge/articles/*.json
          else
            echo "No articles to validate"
          fi
        working-directory: v2

      - name: Check for changes
        id: check
        run: |
          count=$(find v2/knowledge/articles -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count article(s)"
          if [ -z "$(git status --porcelain -- v2/knowledge/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/knowledge/
          date=$(date -u +%Y-%m-%d)
          git commit -m "chore: auto-collect ${{ steps.check.outputs.count }} articles on $date"
          git push
